syntax = "proto2";

package apollo.cyber.proto;

import "cyber/proto/qos_profile.proto";

message ReaderOption {
  optional string channel = 1;                           // Channel名称
  optional QosProfile qos_profile = 2;                   // Qos配置文件
  // depth: used to define capacity of processed messages
  optional uint32 pending_queue_size = 3 [default = 1];  // 等待队列长度
    // used to define capacity of unprocessed messages
}

/* 普通组件配置 */
message ComponentConfig {
  optional string name = 1;              // 组件名称
  optional string config_file_path = 2;  // 配置文件路径
  optional string flag_file_path = 3;    // 启动参数文件路径
  repeated ReaderOption readers = 4;     // Reader配置
}

/* 定时组件配置 */
message TimerComponentConfig {
  optional string name = 1;              // 组件名称
  optional string config_file_path = 2;  // 配置文件路径
  optional string flag_file_path = 3;    // 启动参数文件路径
  optional uint32 interval = 4;          // 定时器间隔, 单位ms
}
